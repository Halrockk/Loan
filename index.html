<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào Em!</title>
    <style>
        .overlay-image {
            position: absolute;
            top: 20%; /* Căn giữa theo chiều dọc */
            left: 50%; /* Căn giữa theo chiều ngang */
            transform: translate(-50%, -50%);
            max-width: 50%;
            max-height: 50%;
            z-index: 1;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 0.5s;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            overflow: hidden; /* Ngăn chặn cuộn */
            background-size: cover;
            background-position: center;
        }
        .message-container {
            display: none;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }
        .active {
            display: block;
        }
        h2 {
            font-size: 26px;
            line-height: 1.2;
            margin: 60px 0 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            
        }
         h3 {
            font-size: 25px;
            line-height: 1.2;
            margin: 280px 0 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 26px;
            line-height: 1.2;
            margin: 250px 0 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        
        h1:nth-of-type(2),
        h1:nth-of-type(4) {
            margin-top: 20px;
        }
        h3:nth-of-type(2),
        h3:nth-of-type(4) {
            margin-top: 2px;
        }
        button {
            margin-top: 150px; /* Tăng khoảng cách ở đây để kéo xuống */
            padding: 15px 20px;
            font-size: 25px;
            border: none;
            border-radius: 8px;
            background-color: #ff5c5c;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            max-width: 200px;
        }
        button:hover {
            background-color: #ff3030;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <audio id="background-music" loop>
    <source src="nhac1.mp3" type="audio/mp3">
    Your browser does not support the audio element.
    </audio>
    <!-- Bước 1 -->
    <div id="message1" class="message-container active" style="background-image: url('anh1.jpg');">
        <h1>Chào em! Anh rất vui</h1>
        <h1>vì em đang đọc tin nhắn này.</h1>
        <button onclick="nextMessage(1)">Tiếp tục</button>
    </div>

    <!-- Bước 2 -->
    <div id="message2" class="message-container" style="background-image: url('anh1.jpg');">
        <h1>Liệu em có còn nhớ,</h1>
        <h1>lời anh đã chúc em ngày 14/2?</h1>
        <button onclick="nextMessage(2)">Tiếp tục</button>
    </div>

    <!-- Bước 3 -->
    <div id="message3" class="message-container" style="background-image: url('anh3.jpg');">
        <h3 id="message1Text">Anh đã chúc "14/2 năm nay sẽ</h3>
        <h3>là năm cuối cùng em một mình"</h3>
        <h2 id="message2Text" class="hidden">"Và anh muốn là người thực hiện lời chúc ấy"</h2>
        <img src="anh4.jpg" alt="Anh 4" class="overlay-image" />
        <button id="continueButton" onclick="showNextMessage()">Tiếp tục</button>
    </div>

    <script>
        let currentMessageIndex = 0;
        const messages = [
            { element: document.getElementById('message1'), background: '#072d63' },
            { element: document.getElementById('message2'), background: '#ea0f55' },
            { element: document.getElementById('message3'), background: '#ea0f55' }
        ];

        function nextMessage(index) {
            messages[currentMessageIndex].element.classList.remove('active');
            currentMessageIndex++;
            if (currentMessageIndex < messages.length) {
                messages[currentMessageIndex].element.classList.add('active');
            }
        }

        function showNextMessage() {
            const message2Text = document.getElementById('message2Text');

            if (message2Text.classList.contains('hidden')) {
                message2Text.classList.remove('hidden');
                document.getElementById('continueButton').style.display = 'none';
            }
        }

        document.body.style.background = messages[currentMessageIndex].background;
    </script>

</body>
</html>
